services:
  - type: web
    name: proyecto-investigacion-operativa-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include-workspace-root && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_MODE
        value: supabase
      - key: MAP_PROVIDER
        value: osrm
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
